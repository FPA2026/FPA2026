<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban LMS - IA para Desarrollo Web</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; }
  .column-scroll::-webkit-scrollbar { width: 6px; }
  .column-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .card-dragging { opacity: 0.4; transform: rotate(2deg); }
  .column-dragover { background-color: #eef2ff; border-color: #6366f1 !important; }
  .modal-backdrop { background-color: rgba(15, 23, 42, 0.6); }
  .fade-in { animation: fadeIn 0.15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .spinner { border-top-color: transparent; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- Header -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold">AI</div>
      <div>
        <h1 class="text-lg font-semibold text-slate-800 leading-tight">Kanban · LMS IA para Web</h1>
        <p class="text-xs text-slate-400">Gestión de equipo de desarrollo</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="sync-indicator" class="hidden items-center gap-2 text-xs text-slate-400">
        <span class="w-3 h-3 rounded-full border-2 border-slate-300 spinner"></span> Sincronizando...
      </span>
      <button id="btn-refresh" class="text-sm text-slate-500 hover:text-indigo-600 border border-slate-200 hover:border-indigo-300 rounded-lg px-3 py-2 transition">
        ⟳ Actualizar
      </button>
      <button id="btn-new-card" class="text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 transition shadow-sm">
        + Nueva tarjeta
      </button>
    </div>
  </div>
</header>

<!-- Board -->
<main class="max-w-[1600px] mx-auto px-6 py-6">
  <div id="board" class="grid grid-cols-1 md:grid-cols-5 gap-4">
    <!-- Columns are rendered by JS -->
  </div>
</main>

<!-- Card Modal -->
<div id="card-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
  <div class="bg-white w-full max-w-lg mx-4 rounded-2xl shadow-xl p-6 fade-in max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 id="modal-title" class="text-lg font-semibold text-slate-800">Nueva tarjeta</h2>
      <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>

    <form id="card-form" class="space-y-4">
      <input type="hidden" id="card-id">

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Título</label>
        <input type="text" id="card-titulo" required
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none"
          placeholder="Ej. Crear módulo 3: Prompts para landing pages">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Descripción</label>
        <textarea id="card-descripcion" rows="3"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none"
          placeholder="Detalle de la actividad..."></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Responsable</label>
          <select id="card-responsable"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none">
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Estado</label>
          <select id="card-estado"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none">
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Fecha inicio</label>
          <input type="date" id="card-fecha-inicio"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Fecha fin</label>
          <input type="date" id="card-fecha-fin"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">URL del entregable</label>
        <input type="url" id="card-url"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none"
          placeholder="https://...">
      </div>

      <div class="flex items-center justify-between pt-2">
        <button type="button" id="btn-delete-card"
          class="hidden text-sm text-red-500 hover:text-red-700 font-medium">
          Eliminar tarjeta
        </button>
        <div class="flex gap-2 ml-auto">
          <button type="button" id="btn-cancel"
            class="text-sm text-slate-500 hover:text-slate-700 px-4 py-2 rounded-lg border border-slate-200">
            Cancelar
          </button>
          <button type="submit"
            class="text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 shadow-sm">
            Guardar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
  <div class="bg-slate-800 text-white text-sm px-4 py-3 rounded-lg shadow-lg fade-in"></div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
// Reemplaza esta URL por la de tu Web App de Apps Script (paso a paso en README.md)
const API_URL = "https://script.google.com/macros/s/AKfycbyo6Eoa91oXsSwwwijSm1mg9ukvZNGWr7WO1LfLe_K6qsw5rOqYslM-oBlXxOGnFCWjew/exec";

// Ajusta esta lista con los nombres reales de tu equipo
const TEAM_MEMBERS = ["Jose García", "Juan Felipe Oduber"];

// Debe coincidir EXACTAMENTE con los nombres de columna usados en el backend
const COLUMNS = [
  { key: "Backlog",       label: "Backlog",       color: "bg-slate-400" },
  { key: "Asignado a",    label: "Asignado a",    color: "bg-sky-400" },
  { key: "En progreso",   label: "En progreso",   color: "bg-amber-400" },
  { key: "En revisión",   label: "En revisión",   color: "bg-purple-400" },
  { key: "Finalizado",    label: "Finalizado",    color: "bg-emerald-400" },
];

/* =========================================================
   ESTADO EN MEMORIA
   ========================================================= */
let cards = [];
let draggedCardId = null;

/* =========================================================
   UTILIDADES
   ========================================================= */
function showToast(message, isError = false) {
  const toast = document.getElementById("toast");
  const inner = toast.querySelector("div");
  inner.textContent = message;
  inner.className = `text-white text-sm px-4 py-3 rounded-lg shadow-lg fade-in ${isError ? "bg-red-600" : "bg-slate-800"}`;
  toast.classList.remove("hidden");
  setTimeout(() => toast.classList.add("hidden"), 3000);
}

function setSyncing(on) {
  const el = document.getElementById("sync-indicator");
  el.classList.toggle("hidden", !on);
  el.classList.toggle("flex", on);
}

function fmtDate(d) {
  if (!d) return "";
  const date = new Date(d);
  if (isNaN(date)) return d;
  return date.toLocaleDateString("es-CO", { day: "2-digit", month: "short" });
}

/* =========================================================
   API - Comunicación con Google Apps Script
   Nota: usamos POST con Content-Type "text/plain" para evitar
   el preflight OPTIONS, que Apps Script Web Apps no soportan.
   ========================================================= */
async function apiGet() {
  const res = await fetch(`${API_URL}?action=getCards`, { method: "GET" });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Error al obtener tarjetas");
  return json.data;
}

async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Error en la operación");
  return json.data;
}

async function loadCards() {
  setSyncing(true);
  try {
    cards = await apiGet();
    renderBoard();
  } catch (err) {
    console.error(err);
    showToast("No se pudieron cargar las tarjetas. Revisa la URL de la API.", true);
  } finally {
    setSyncing(false);
  }
}

async function createCard(data) {
  setSyncing(true);
  try {
    const newCard = await apiPost({ action: "createCard", ...data });
    cards.push(newCard);
    renderBoard();
    showToast("Tarjeta creada correctamente");
  } catch (err) {
    showToast(err.message, true);
  } finally {
    setSyncing(false);
  }
}

async function updateCard(id, data) {
  setSyncing(true);
  try {
    const updated = await apiPost({ action: "updateCard", id, ...data });
    cards = cards.map(c => (c.id === id ? updated : c));
    renderBoard();
    showToast("Tarjeta actualizada");
  } catch (err) {
    showToast(err.message, true);
  } finally {
    setSyncing(false);
  }
}

async function updateCardStatus(id, newStatus) {
  setSyncing(true);
  try {
    const updated = await apiPost({ action: "updateStatus", id, estado: newStatus });
    cards = cards.map(c => (c.id === id ? updated : c));
    renderBoard();
    if (newStatus === "En revisión") {
      showToast("Tarjeta movida a 'En revisión'. Se notificó al Sprint Master.");
    }
  } catch (err) {
    showToast(err.message, true);
    renderBoard(); // revert visual state
  } finally {
    setSyncing(false);
  }
}

async function deleteCard(id) {
  setSyncing(true);
  try {
    await apiPost({ action: "deleteCard", id });
    cards = cards.filter(c => c.id !== id);
    renderBoard();
    showToast("Tarjeta eliminada");
  } catch (err) {
    showToast(err.message, true);
  } finally {
    setSyncing(false);
  }
}

/* =========================================================
   RENDERIZADO DEL TABLERO
   ========================================================= */
function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  COLUMNS.forEach(col => {
    const colCards = cards.filter(c => c.estado === col.key);

    const column = document.createElement("div");
    column.className = "bg-slate-50 rounded-2xl border border-slate-200 flex flex-col";
    column.dataset.status = col.key;

    column.innerHTML = `
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full ${col.color}"></span>
          <h3 class="text-sm font-semibold text-slate-700">${col.label}</h3>
        </div>
        <span class="text-xs text-slate-400 bg-white border border-slate-200 rounded-full px-2 py-0.5">${colCards.length}</span>
      </div>
      <div class="column-scroll flex-1 p-3 space-y-3 overflow-y-auto min-h-[200px]" data-dropzone="${col.key}"></div>
    `;

    board.appendChild(column);

    const dropzone = column.querySelector("[data-dropzone]");
    colCards.forEach(card => dropzone.appendChild(renderCard(card)));

    // Drag & drop events on the column
    dropzone.addEventListener("dragover", e => {
      e.preventDefault();
      dropzone.parentElement.classList.add("column-dragover");
    });
    dropzone.addEventListener("dragleave", () => {
      dropzone.parentElement.classList.remove("column-dragover");
    });
    dropzone.addEventListener("drop", e => {
      e.preventDefault();
      dropzone.parentElement.classList.remove("column-dragover");
      const id = e.dataTransfer.getData("text/plain");
      const card = cards.find(c => String(c.id) === String(id));
      if (card && card.estado !== col.key) {
        card.estado = col.key; // optimistic update
        renderBoard();
        updateCardStatus(id, col.key);
      }
    });
  });
}

function renderCard(card) {
  const el = document.createElement("div");
  el.className = "bg-white rounded-xl border border-slate-200 shadow-sm p-3 cursor-grab active:cursor-grabbing hover:shadow-md transition";
  el.draggable = true;
  el.dataset.id = card.id;

  const hasUrl = card.url && card.url.trim() !== "";

  el.innerHTML = `
    <p class="text-sm font-medium text-slate-800 mb-1 line-clamp-2">${escapeHtml(card.titulo)}</p>
    ${card.descripcion ? `<p class="text-xs text-slate-500 mb-2 line-clamp-2">${escapeHtml(card.descripcion)}</p>` : ""}
    <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
      <span class="truncate">${fmtDate(card.fechaInicio)} → ${fmtDate(card.fechaFin)}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="inline-flex items-center gap-1 text-xs font-medium text-indigo-700 bg-indigo-50 rounded-full px-2 py-1">
        👤 ${escapeHtml(card.responsable || "Sin asignar")}
      </span>
      ${hasUrl ? `<a href="${escapeAttr(card.url)}" target="_blank" rel="noopener" class="text-xs text-emerald-600 hover:underline" onclick="event.stopPropagation()">🔗 Link</a>` : ""}
    </div>
  `;

  el.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", card.id);
    el.classList.add("card-dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("card-dragging"));
  el.addEventListener("click", () => openModal(card));

  return el;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}
function escapeAttr(str) {
  return (str ?? "").replace(/"/g, "&quot;");
}

/* =========================================================
   MODAL
   ========================================================= */
function populateSelects() {
  const responsableSel = document.getElementById("card-responsable");
  responsableSel.innerHTML = TEAM_MEMBERS.map(name => `<option value="${name}">${name}</option>`).join("");

  const estadoSel = document.getElementById("card-estado");
  estadoSel.innerHTML = COLUMNS.map(c => `<option value="${c.key}">${c.label}</option>`).join("");
}

function openModal(card = null) {
  document.getElementById("card-modal").classList.remove("hidden");
  document.getElementById("card-modal").classList.add("flex");
  document.getElementById("card-form").reset();
  populateSelects();

  if (card) {
    document.getElementById("modal-title").textContent = "Editar tarjeta";
    document.getElementById("card-id").value = card.id;
    document.getElementById("card-titulo").value = card.titulo || "";
    document.getElementById("card-descripcion").value = card.descripcion || "";
    document.getElementById("card-responsable").value = card.responsable || "Sin asignar";
    document.getElementById("card-estado").value = card.estado || "Backlog";
    document.getElementById("card-fecha-inicio").value = card.fechaInicio || "";
    document.getElementById("card-fecha-fin").value = card.fechaFin || "";
    document.getElementById("card-url").value = card.url || "";
    document.getElementById("btn-delete-card").classList.remove("hidden");
  } else {
    document.getElementById("modal-title").textContent = "Nueva tarjeta";
    document.getElementById("card-id").value = "";
    document.getElementById("card-estado").value = "Backlog";
    document.getElementById("btn-delete-card").classList.add("hidden");
  }
}

function closeModal() {
  document.getElementById("card-modal").classList.add("hidden");
  document.getElementById("card-modal").classList.remove("flex");
}

document.getElementById("btn-new-card").addEventListener("click", () => openModal());
document.getElementById("btn-close-modal").addEventListener("click", closeModal);
document.getElementById("btn-cancel").addEventListener("click", closeModal);
document.getElementById("btn-refresh").addEventListener("click", loadCards);

document.getElementById("card-form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = document.getElementById("card-id").value;
  const data = {
    titulo: document.getElementById("card-titulo").value.trim(),
    descripcion: document.getElementById("card-descripcion").value.trim(),
    responsable: document.getElementById("card-responsable").value,
    estado: document.getElementById("card-estado").value,
    fechaInicio: document.getElementById("card-fecha-inicio").value,
    fechaFin: document.getElementById("card-fecha-fin").value,
    url: document.getElementById("card-url").value.trim(),
  };

  if (id) {
    await updateCard(id, data);
  } else {
    await createCard(data);
  }
  closeModal();
});

document.getElementById("btn-delete-card").addEventListener("click", async () => {
  const id = document.getElementById("card-id").value;
  if (id && confirm("¿Eliminar esta tarjeta permanentemente?")) {
    await deleteCard(id);
    closeModal();
  }
});

/* =========================================================
   INICIALIZACIÓN
   ========================================================= */
populateSelects();
renderBoard();
loadCards();
</script>
</body>
</html>
